# NetSentinel - Production Docker Compose
# Usage: docker-compose -f docker-compose.prod.yml up -d
#
# IMPORTANT: Before deploying to production:
# 1. Copy .env.example to .env and configure ALL required values
# 2. Generate secure secrets: openssl rand -hex 32
# 3. Configure TLS certificates in infra/docker/ssl/
# 4. Review and adjust resource limits for your environment

services:
  # ============================================================================
  # DATABASE
  # ============================================================================
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: netsentinel-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-netsentinel}
    # NOTE: No ports exposed - only accessible within Docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netsentinel-internal
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ============================================================================
  # CACHE & MESSAGE QUEUE
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: netsentinel-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # NOTE: No ports exposed - only accessible within Docker network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netsentinel-internal
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================================================
  # FLOW COLLECTOR (Go)
  # ============================================================================
  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
      target: production
    container_name: netsentinel-collector
    restart: always
    environment:
      COLLECTOR_UDP_PORT: 2055
      COLLECTOR_BATCH_SIZE: ${COLLECTOR_BATCH_SIZE:-100}
      COLLECTOR_FLUSH_INTERVAL: ${COLLECTOR_FLUSH_INTERVAL:-1s}
      DEFAULT_SITE_ID: ${DEFAULT_SITE_ID:?DEFAULT_SITE_ID is required}
      BACKEND_URL: http://backend:8000
      COLLECTOR_API_KEY: ${COLLECTOR_API_KEY:?COLLECTOR_API_KEY is required}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    ports:
      - "2055:2055/udp"  # NetFlow/IPFIX ingestion - must be exposed
    expose:
      - "8080"  # Health/metrics - internal only
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - netsentinel-internal
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================================================
  # BACKEND API (FastAPI)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: netsentinel-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-netsentinel}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      COLLECTOR_API_KEY: ${COLLECTOR_API_KEY:?COLLECTOR_API_KEY is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      ENVIRONMENT: production
    expose:
      - "8000"  # Internal only - nginx handles external traffic
    volumes:
      - ml_models:/app/ml_models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - netsentinel-internal
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ============================================================================
  # CELERY WORKER
  # ============================================================================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: netsentinel-celery-worker
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=warning --concurrency=${CELERY_CONCURRENCY:-4}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-netsentinel}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      ML_MODELS_PATH: /app/ml_models
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      ENVIRONMENT: production
    volumes:
      - ml_models:/app/ml_models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - netsentinel-internal
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ============================================================================
  # CELERY BEAT (Scheduler)
  # ============================================================================
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: netsentinel-celery-beat
    restart: always
    command: celery -A app.workers.celery_app beat --loglevel=warning --pidfile=/tmp/celerybeat.pid
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      ENVIRONMENT: production
    volumes:
      - celerybeat_schedule:/tmp
    depends_on:
      celery-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - netsentinel-internal

  # ============================================================================
  # FRONTEND (React - Production Build)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: netsentinel-frontend
    restart: always
    expose:
      - "80"  # Internal only - nginx handles external traffic
    depends_on:
      - backend
    networks:
      - netsentinel-internal
    deploy:
      resources:
        limits:
          memory: 128M

  # ============================================================================
  # NGINX (Reverse Proxy with TLS)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: netsentinel-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - netsentinel-internal
    deploy:
      resources:
        limits:
          memory: 128M

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  netsentinel-internal:
    driver: bridge
    internal: false  # Allow outbound for email notifications, etc.

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ml_models:
    driver: local
  celerybeat_schedule:
    driver: local
